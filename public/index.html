<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oligarchy</title>
<meta name="description" content="Elite capital. Public code.">
<link rel="icon" href="https://omarchy.org/assets/images/favicon.png">
<meta name="theme-color" content="#1a1b26">
<link rel="preload" href="fonts/JetBrainsMono-Light.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Self-hosted rather than pulled from Google Fonts: these are the same
     woff2s omarchy-site ships, and a swapped fallback would reflow the whole
     page. Light blocks (it's the banner), Bold swaps (it's one link). */
  @font-face {
    font-display: block;
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 300;
    src: url('fonts/JetBrainsMono-Light.woff2') format('woff2');
  }

  @font-face {
    font-display: swap;
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 700;
    src: url('fonts/JetBrainsMono-Bold.woff2') format('woff2');
  }

  /* Omarchy's tokyo-night, the same theme omarchy-site is painted in.
     Clicking the banner swaps these for another of Omarchy's default themes —
     see bin/build-themes for where the values come from. */
  :root {
    --background: #1a1b26;
    --green:      #9ece6a;
    --blue:       #7aa2f7;
    --cyan:       #0db9d7;
    --white:      #c0caf5;
    --accent:     #7aa2f7;
    --font-family: 'JetBrains Mono', monospace;
    --transition: 0.15s cubic-bezier(0.33, 1, 0.68, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { color-scheme: dark; }

  body {
    background: var(--background);
    color: var(--blue);
    font-family: var(--font-family);
    font-weight: 300;
    line-height: 1.5;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2em;
    padding: 2em 1em;
    text-align: center;
    text-wrap: balance;
    transition: background-color var(--transition), color var(--transition);
  }

  /* Vector, not a <pre>: at the sizes a phone lands on, Chrome's per-glyph
     rounding knocked the rows out of column and the word turned to mush. The
     geometry is JetBrains Mono's own, so it draws what the <pre> was meant to
     look like — see bin/build-logo. 55.8rem is the width the type used to cap
     at, and 80vw tracks omarchy.org's proportion below that. */
  .banner {
    background: none;
    border: 0;
    color: var(--green);
    cursor: pointer;
    display: block;
    padding: 0;
    width: min(80vw, 55.8rem);
    transition: color var(--transition);
  }

  .banner:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 0.5em;
  }

  .logo {
    display: block;
    height: auto;
    width: 100%;
  }

  /* Two lines are reserved whatever the tagline, so rotation never moves the
     page. 40ch is the widest measure that still wraps the longest line into
     two, and the vw term keeps that 40ch inside the viewport on phones. */
  .tagline {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 3em;
    font-size: min(3.5vw, 1.5rem);
    max-width: 40ch;
    transition: opacity 0.4s cubic-bezier(0.33, 1, 0.68, 1);
  }

  .tagline.fading { opacity: 0; }

  a {
    color: var(--cyan);
    font-weight: 700;
    font-size: clamp(0.875rem, 1.75vw, 1rem);
    text-decoration-thickness: 0.0875em;
    text-underline-offset: 0.25em;
    transition: color var(--transition);
  }

  @media (hover: hover) {
    a:hover { color: var(--white); }
    .banner:hover { color: var(--accent); }
  }

  @media (prefers-reduced-motion: reduce) {
    body, .banner, .tagline { transition: none; }
  }
</style>
</head>
<body>
  <button class="banner" type="button" aria-label="Change colour scheme">
  <!-- logo:start -->

 5355.625h1715v1320h-1715zM50732.5 5355.625h1715v1320h-1715zM54077.5 5355.625h1715v1320h-1715zM0 6449.375h1715v1320h-1715zM3902.5 6449.375h1715v1320h-1715zM6132.5 6449.375h1715v1320h-1715zM7805 6449.375h300v1320h-300zM10592.5 7109.375h600v660h-600zM11707.5 6449.375h1715v1320h-1715zM15610 6449.375h1715v1320h-1715zM19512.5 6449.375h1715v1320h-1715zM22857.5 6449.375h1715v1320h-1715zM26760 6449.375h1715v1320h-1715zM30105 6449.375h1715v1320h-1715zM34007.5 6449.375h1715v1320h-1715zM36237.5 6449.375h1715v1320h-1715zM40140 6449.375h1715v1320h-1715zM43485 6449.375h1715v1320h-1715zM47387.5 6449.375h1715v1320h-1715zM50732.5 6449.375h1715v1320h-1715zM54077.5 6449.375h1715v1320h-1715zM557.5 7543.125h600v660h-600zM1115 7543.125h3387.5v1320h-3387.5zM4460 7543.125h600v660h-600zM6132.5 7543.125h2830v1320h-2830zM8920 8203.125h1157.5v660h-1157.5zM10035 7543.125h1157.5v1320h-1157.5zM11707.5 7543.125h600v1320h-600zM12265 7543.125h600v660h-600zM15610 7543.125h4502.5v1320h-4502.5zM20070 7543.125h600v660h-600zM22857.5 7543.125h1715v1320h-1715zM26760 7543.125h600v1320h-600zM27317.5 7543.125h600v660h-600zM30105 7543.125h1715v1320h-1715zM34007.5 7543.125h1715v1320h-1715zM36237.5 7543.125h4502.5v1320h-4502.5zM40697.5 7543.125h600v660h-600zM43485 7543.125h1715v1320h-1715zM47387.5 7543.125h600v1320h-600zM47945 7543.125h600v660h-600zM51290 7543.125h600v660h-600zM51847.5 7543.125h2830v1320h-2830zM54635 7543.125h600v660h-600zM6132.5 8636.875h600v660h-600zM30105 8636.875h1715v1320h-1715zM34007.5 8636.875h1715v1320h-1715z"/></svg>

  </button>
  <p class="tagline" aria-live="polite">Elite capital. Public code.</p>
  <a href="https://omarchy.org/">omarchy.org&nbsp;&rarr;</a>
  <script>
    const taglines = [
      "Elite capital. Public code.",
      "From the 0.001% to /home/you.",
      "Redistributing billionaire wealth, one ISO at a time.",
      "Billionaire-grade Linux. Zero-dollar pricing.",
      "Billionaires in. Tarballs out.",
      "Free software. Expensive patrons.",
      "Free as in speech. Free as in billionaires paid for it.",
      "Capitalism funded it. Everyone gets it.",
      "The distro with no business model and excellent capitalization.",
      "An operating system with patrons, not customers.",
      "Burning billionaire money so you don't have to configure Arch.",
      "Your free operating system, brought to you by unreasonable amounts of money.",
      "Zero dollars. Several billionaires."
    ];

    // name, mode, background, banner, tagline, link, link hover, banner hover
    const themes = [
      // themes:start
      ["catppuccin","dark","#1e1e2e","#a6e3a1","#89b4fa","#94e2d5","#cdd6f4","#89b4fa"],
      ["catppuccin-latte","light","#eff1f5","#40a02b","#1e66f5","#179299","#4c4f69","#1e66f5"],
      ["ethereal","dark","#060b1e","#92a593","#7d82d9","#dfeaf0","#ffcead","#7d82d9"],
      ["everforest","dark","#2d353b","#a7c080","#7fbbb3","#83c092","#d3c6aa","#7fbbb3"],
      ["flexoki-light","light","#fffcf0","#879a39","#205ea6","#3aa99f","#100f0f","#205ea6"],
      ["gruvbox","dark","#282828","#a9b665","#7daea3","#89b482","#d4be98","#7daea3"],
      ["hackerman","dark","#0b0c16","#4fe88f","#829dd4","#d1fffe","#ddf7ff","#82fb9c"],
      ["kanagawa","dark","#1f1f28","#76946a","#7e9cd8","#7aa89f","#dcd7ba","#dcd7ba"],
      ["last-horizon","dark","#0c0b0c","#87a9b0","#b59790","#a5a0b6","#e2dddc","#b59790"],
      ["lumon","dark","#16242d","#5e95bc","#6fb8e3","#d1eef8","#f2fcff","#8bc9eb"],
      ["lupine","light","#fafafa","#4a2fd0","#3264eb","#3986ff","#000000","#3264eb"],
      ["matte-black","dark","#121212","#ffc107","#e68e0d","#eaeaea","#bebebe","#e68e0d"],
      ["miasma","dark","#222222","#5f875f","#78824b","#c9a554","#c2c2b0","#78824b"],
      ["nord","dark","#2e3440","#a3be8c","#81a1c1","#8fbcbb","#d8dee9","#81a1c1"],
      ["osaka-jade","dark","#111c18","#549e6a","#509475","#8cd3cb","#f7e8b2","#509475"],
      ["retro-82","dark","#05182e","#028391","#3f8f8a","#8cbfb8","#f6dcac","#faa968"],
      ["ristretto","dark","#2c2525","#adda78","#f38d70","#9bf1e1","#e6d9db","#f38d70"],
      ["rose-pine","light","#faf4ed","#286983","#56949f","#d7827e","#575279","#56949f"],
      ["solitude","dark","#101315","#9fa5a9","#798186","#707070","#a5aeb4","#798186"],
      ["tokyo-night","dark","#1a1b26","#9ece6a","#7aa2f7","#0db9d7","#c0caf5","#7aa2f7"],
      ["vantablack","dark","#000000","#b6b6b6","#8d8d8d","#b0b0b0","#ffffff","#8d8d8d"],
      ["white","light","#ffffff","#3a3a3a","#1a1a1a","#3e3e3e","#000000","#6e6e6e"],
      // themes:end
    ];

    const root = document.documentElement;
    const themeColor = document.querySelector('meta[name=theme-color]');
    // The stylesheet already paints tokyo-night, so the first click moves on
    // from where the page starts rather than repainting it.
    let current = themes.findIndex(theme => theme[0] === 'tokyo-night');

    document.querySelector('.banner').addEventListener('click', () => {
      const [, mode, background, green, blue, cyan, white, accent] =
        themes[current = (current + 1) % themes.length];

      root.style.colorScheme = mode;
      for (const [name, color] of Object.entries(
        { background, green, blue, cyan, white, accent })) {
        root.style.setProperty('--' + name, color);
      }
      themeColor.content = background;
    });

    const el = document.querySelector('.tagline');
    let i = Math.floor(Math.random() * taglines.length);
    el.textContent = taglines[i];

    setInterval(() => {
      el.classList.add('fading');
      setTimeout(() => {
        i = (i + 1) % taglines.length;
        el.textContent = taglines[i];
        el.classList.remove('fading');
      }, 400);
    }, 4000);
  </script>
</body>
</html>
